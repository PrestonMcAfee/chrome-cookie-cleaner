<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #202124;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #292a2d;
        color: #e8eaed;
      }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .header img {
      width: 20px;
      height: 20px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #dadce0;
      background: #f8f9fa;
      color: #202124;
      text-align: left;
      transition: background 0.15s ease;
    }
    @media (prefers-color-scheme: dark) {
      button {
        background: #35363a;
        color: #e8eaed;
        border-color: #5f6368;
      }
    }
    button:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
      color: #1a73e8;
    }
    @media (prefers-color-scheme: dark) {
      button:hover {
        background: #3c4043;
        border-color: #8ab4f8;
        color: #8ab4f8;
      }
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #1e8e3e;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="icon">
    <span>Cookie Cleaner</span>
  </div>
  <div class="actions">
    <button id="openOptionsBtn">⚙️ Edit Whitelist</button>
    <button id="runSweepBtn">🧹 Run Sweep Now</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
